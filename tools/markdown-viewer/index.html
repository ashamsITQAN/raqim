<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عارض مقالات مارك داون</title>
<style>
  :root{--bg:#f6f4ef;--card:#fff;--ink:#1f2a2e;--muted:#6b7478;--line:#e3ded3;--brand:#22433d;--brand-2:#e8f1ec;--ok:#1d6b3a;--mono:ui-monospace,"Cascadia Mono",Consolas,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;font-size:16px;line-height:1.8}
  header{background:var(--brand);color:#fff;padding:14px 24px}
  header h1{margin:0;font-size:19px} header p{margin:2px 0 0;opacity:.85;font-size:13px}
  .bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .tab{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);padding:6px 16px;border-radius:8px;cursor:pointer}
  .tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .sp{flex:1}
  .b{font:inherit;font-size:14px;border:1px solid var(--brand);background:#fff;color:var(--brand);padding:6px 14px;border-radius:8px;cursor:pointer}
  .b.p{background:var(--brand);color:#fff}
  .msg{font-size:13px;color:var(--ok);min-width:120px}
  main{max-width:900px;margin:0 auto;padding:20px}
  .hidden{display:none!important}
  #view{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px 34px}
  #view h1{font-size:26px;color:var(--brand);margin-top:0} #view h2{font-size:20px;color:var(--brand);margin-top:28px;border-bottom:1px solid var(--line);padding-bottom:4px}
  #view table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px;display:block;overflow-x:auto}
  #view th,#view td{border:1px solid var(--line);padding:6px 10px;text-align:right;vertical-align:top}
  #view th{background:#faf8f3}
  #view code{font-family:var(--mono);background:#f1eee6;padding:1px 5px;border-radius:4px;direction:ltr;unicode-bidi:embed;font-size:.9em}
  #view pre{background:#f1eee6;padding:12px;border-radius:8px;direction:ltr;text-align:left;overflow-x:auto}
  #view pre code{background:none;padding:0}
  #view img{max-width:100%;border:1px solid var(--line);border-radius:8px;display:block;margin:10px auto}
  #view blockquote{border-inline-start:4px solid var(--brand-2);margin:0;padding:4px 14px;color:var(--muted)}
  #src{width:100%;min-height:75vh;font-family:var(--mono);font-size:14px;line-height:1.7;padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff;direction:rtl;unicode-bidi:plaintext;resize:vertical}
  .hint{color:var(--muted);font-size:13px;margin:0 0 10px}
</style>
</head>
<body>
<header>
  <h1>عارض مقالات مارك داون</h1>
  <p>اعرض المقال منسّقًا أو بأكواده، وانسخه بالصيغة التي تحتاجها. ويمكنك لصق أي مقال آخر في تبويب «مارك داون».</p>
</header>
<div class="bar">
  <button class="tab on" data-t="view">العرض الطبيعي</button>
  <button class="tab" data-t="src">مارك داون (الأكواد)</button>
  <span class="sp"></span>
  <button class="b p" id="copyMd">نسخ المارك داون</button>
  <button class="b" id="copyRich">نسخ النص المنسّق</button>
  <button class="b" id="reset">استعادة مقال رقيم</button>
  <span class="msg" id="msg"></span>
</div>
<main>
  <article id="view"></article>
  <div id="srcWrap" class="hidden">
    <p class="hint">عدّل هنا أو الصق مقالًا آخر، ويتحدث «العرض الطبيعي» تلقائيًا.</p>
    <textarea id="src" spellcheck="false"></textarea>
  </div>
</main>

<script>
const DEFAULT_MD="# رقيم: أداة لتجهيز المصاحف الصوتية وفق معيار مرقوم\n\nأحمد شمس · 20 نوفمبر 2026\n\n«رقيم» (RAQIM: Recitation Audio Quran Integrated Manager) أداة مجانية في ملف واحد، تأخذ مصحفًا صوتيًا من 114 ملفًا وتخرجه جاهزًا للرفع على فنار وغيره من الأنظمة: أسماء ملفات مطابقة لمعيار مرقوم، ونسخة MP3 أو M4A بالجودة المطلوبة، وبيانات داخلية موحدة بالعربية.\n\n**ثلاثة برامج في أداة واحدة.** كان تجهيز المصحف للنشر يحتاج إلى ثلاثة برامج منفصلة: برنامج لإعادة تسمية الملفات (التسمية الخارجية)، وبرنامج لكتابة بياناتها (التسمية الداخلية)، وبرنامج لتحويل الصوتيات. ولكل برنامج إعداداته وخطواته، والانتقال بينها يضاعف فرص الخطأ. الأداة تجمع الثلاثة في ملف واحد، ببيانات تُدخَل مرة واحدة وتُستعمل في المراحل كلها، بل تنجز الثلاثة في خطوة واحدة في مسار التحويل: تُنتج النسخة وتسمّيها وتكتب بياناتها معًا. وتُكتب البيانات الداخلية كلها بترميز UTF-16 مع BOM، فتبقى العربية مقروءة سليمة في الأنظمة والمشغلات الشائعة دون رموز غريبة.\n\n**مجانية بالكامل وبلا أي متطلبات.** لا تحتاج إلى تثبيت برامج، ولا إلى رخصة، ولا إلى مفاتيح تفعيل، ولا إلى شراء أي شيء، ولا إلى حساب أو اتصال بالإنترنت. ملف واحد تفتحه في المتصفح فيعمل فورًا، ويمكن نسخه وتمريره لأي فريق أو شريك دون قيود.\n\n## لماذا بنينا هذه الأداة؟\n\nيصلنا المصحف الواحد من القارئ أو الاستوديو بأسماء مثل `001.mp3` أو `سورة البقرة.wav` أو `Dosari_128kbps_002.mp3`، وكل جهة تسمّي على طريقتها. وحين تتعدد المصاحف والروايات وطرق الأداء ونسخ المؤثرات، يصعب على المنصة والمطوّر والمستخدم معرفة ما في الملف من اسمه.\n\nلهذا وضع فريق إتقان معيار **مرقوم** (الدليل الإلزامي القرآني الكلّي الموحد) لتسمية كل ما يُرفع على فنار وغيره من الأنظمة، وفيه جزء خاص بملفات التلاوات. لكن تطبيق المعيار يدويًا على 114 ملفًا لكل مصحف عمل ممل وكثير الأخطاء: رقم سورة بخانتين بدل ثلاث، أو رمز رواية مكتوب خطأ، أو عنوان داخلي لسورة أخرى.\n\nالأداة تقوم بهذا العمل كله آليًا، وتنبّه على الأخطاء قبل وقوعها.\n\n## صيغة اسم ملف التلاوة في مرقوم\n\nحسب البند 12.4 من مرقوم، يتكون اسم ملف التلاوة من حقول تفصل بينها شرطة سفلية `_`، مثل:\n\n```\nQR_SC1447_Ibrahim-Addosari_As-Hf_mdd_BR128_FX_001.mp3\n```\n\n| الحقل            | مثال | معناه                               | ملاحظات                                                                                                                     |\n|-----------------------------------------|-----------------------------|------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------|\n| النوع            | `QR`                        | تلاوة صوتية                         | ثابت                                                                                                                        |\n| المشروع والسنة   | `SC1447`                    | المركز السعودي للتلاوات، إصدار 1447 | المشاريع: `SC` المركز السعودي للتلاوات، `TH` تحبير القراءات العشر، `MK` جمعية مكنون، `QQ` قراءات القرآن. السنة اختيارية     |\n| القارئ           | `Ibrahim-Addosari`          | اسم القارئ بالإنجليزية              | حرف كبير أول كل جزء، وبين الأجزاء شرطة عادية                                                                                |\n| القراءة والرواية | `As-Hf`                     | حفص عن عاصم                         | 20 رمزًا للروايات العشرين، مثل `Na-Qa` قالون و`Na-Wa` ورش                                                                    |\n| نمط الأداء       | `mdd`                       | التوسط                              | `qsr` قصر، `wmim` صلة ميم الجمع، `smim` سكونها، `jmea` جمع القراءة. اختياري، ولا يجتمع القصر والتوسط، ولا صلة الميم وسكونها |\n| الجودة           | `BR128`                     | 128 kbps                                                   | `BR64` أو `BR128` أو `BR256` أو `BR320`                                                                                     |\n| المؤثرات         | `FX`                        | نسخة بالمؤثرات                      | يُحذف الحقل في النسخة بدون مؤثرات                                                                                            |\n| رقم السورة       | `001`                       | الفاتحة                             | ثلاث خانات دائمًا حتى تترتب الملفات في كل الأنظمة                                                                            |\n\nلا يحتاج المستخدم إلى حفظ هذه الرموز: يختار الرواية والأداء من قوائم بالعربية، والأداة تكتب الرموز.\n\n## لماذا نسمّي الملفات بهذه الطريقة؟\n\nالاسم وفق مرقوم بطاقة تعريف للملف: يكفي أن تقرأه لتعرف ما فيه، دون أن تفتحه أو تستمع إليه.\n\n- **اسم فريد لا يتكرر:** ملف الفاتحة لكل قارئ ورواية وطريقة أداء وجودة ونسخة مؤثرات له اسم يخصه، فتجتمع مئات المصاحف في نظام واحد دون أن يحلّ ملف محل آخر.\n\n- **ترتيب صحيح في كل الأنظمة:** رقم السورة بثلاث خانات، فتأتي 002 قبل 010، لا بعدها كما يحدث مع 2 و10.\n\n- **بحث وفرز بأي حقل:** كل مصاحف ورش (`Na-Wa`)، أو كل نسخ 128، أو كل نسخ المؤثرات، ببحث بسيط في الاسم.\n\n- **قراءة آلية:** الحقول مفصولة بـ `_` وبترتيب ثابت، فيستطيع فنار أو أي برنامج استخراج القارئ والرواية والسورة من الاسم وملء بيانات المحتوى تلقائيًا.\n\n- **اسم آمن تقنيًا:** حروف لاتينية وأرقام بلا مسافات، فلا يتشوه في الروابط والخوادم وشبكات التوزيع وسطر الأوامر.\n\n- **يبقى إن ضاعت البيانات الداخلية:** بعض المنصات تحذف بيانات الملف الداخلية، أما الاسم فينتقل معه أينما ذهب.\n\n- **تتبّع المصدر والإصدار:** رمز المشروع والسنة يفرّقان بين تسجيلين لقارئ واحد.\n\n- **فحص آلي للجودة:** لأن الصيغة ثابتة يمكن التحقق منها ببرنامج قبل النشر.\n\n- **لغة مشتركة بين الفرق:** المنتج والمدقق والمطوّر والشريك يفهمون الاسم بالطريقة نفسها.\n\n**مثال على أهم فائدة: الحماية من الكتابة فوق الملفات (Overwrite).** لو كانت ملفات المصاحف مرقّمة فقط (`001.mp3` … `114.mp3`)، ثم نسخ أحدهم مصحفًا إلى مجلد مصحف آخر على السيرفر بالخطأ، لحلّت الملفات الجديدة محل الأصلية وضاع مصحف كامل دون أن ينتبه أحد. أما مع أسماء مرقوم فلا يتطابق اسمان من مصحفين مختلفين، فيبقى الملفان معًا، ويظهر الخطأ بوضوح ويُصلح بنقل الملفات إلى مكانها.\n\n**نموذج من مصحف حقيقي قبل التسمية وبعدها.** قبل: ملفات WAV بأسماء تخلط العربية باللاتينية وفيها مسافات وعلامات، وأعمدة العنوان والقارئ والألبوم فارغة.\n\n![ملفات المصحف قبل التسمية](https://community.itqan.dev/assets/files/2026-11-22/1795333799-174885-3-before-naming-1.png)\n\nبعد: أسماء مرقوم موحدة مرتبة، والعنوان ورقم المقطع والقارئ والألبوم مكتوبة بالعربية سليمة في متصفح ملفات Windows.\n\n![ملفات المصحف بعد التسمية وفق مرقوم وكتابة البيانات الداخلية](https://community.itqan.dev/assets/files/2026-11-22/1795333884-416910-4-after-naming-1.png)\n\n## صفحة البداية: ثلاثة مسارات بحسب حالة المصحف\n\nتفتح الأداة على سؤال واحد: «ما حالة المصحف الذي بين يديك؟». وبحسب الجواب تأخذ المستخدم في مسار من خطوات مرقّمة، لا يرى في كل خطوة إلا ما يحتاجه.\n\n![صفحة البداية في أداة رقيم](https://community.itqan.dev/assets/files/2026-11-22/1795333975-598630-1-tool-landing-1.png)\n\n| المسار               | متى يُستعمل                                            | الخطوات                                                                     | الناتج                                                      |\n|---------------------------------------------|------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------|\n| مصحف MP3 جاهز للنشر  | الملفات MP3 بالجودة المطلوبة وتحتاج تسمية وبيانات فقط | بيانات المصحف ← البيانات الداخلية ← الملفات وإعادة التسمية ← كتابة البيانات | الملفات نفسها مسمّاة وفيها بياناتها                          |\n| مصحف يحتاج نسخة MP3  | الأصل WAV، أو MP3 بجودة أعلى من المطلوب               | بيانات المصحف ← البيانات الداخلية ← الملفات ← التحويل                       | مجلد `mp3_128` أو `mp3_128_fx` فيه نسخ مسمّاة وفيها بياناتها |\n| فحص أسماء مصحف موجود | للتأكد من مصحف مسمّى من قبل                            | خطوة واحدة                                                                  | قائمة بالمخالفات حقلًا حقلًا                                  |\n\nفي كل مسار يظهر شريط خطوات أعلى الصفحة، ولا ينتقل المستخدم إلى الخطوة التالية حتى يكتمل المطلوب، كاسم القارئ أو الملفات. ومن يعرف الأداة جيدًا يستطيع عرض كل الأقسام في صفحة واحدة من رابط أسفل صفحة البداية.\n\nوفي مسار التحويل تُعبّأ البيانات قبل التحويل لا بعده، لأن الأداة تسمّي النسخة الناتجة وتكتب بياناتها في اللحظة نفسها، فلا يمرّ المستخدم على الملفات مرتين.\n\n## المسار الأول: مصحف MP3 جاهز للنشر\n\nيدخل المستخدم بيانات المصحف مرة واحدة، ثم يختار مجلد الملفات، فتبني الأداة الأسماء الجديدة للملفات الـ114 وتعرضها في جدول للمراجعة قبل أي تغيير.\n\n**التعرّف على السورة من الاسم القديم.** تقرأ الأداة اسم كل ملف وتستنتج السورة بهذا الترتيب:\n\n1.  رقم من ثلاث خانات مثل `002`، وتتجاهل أرقامًا كالجودة `128`.\n\n2.  اسم عربي مثل «سورة البقرة» أو «آل عمران»، مع تجاهل التشكيل واختلاف الهمزات والتاء المربوطة.\n\n3.  اسم إنجليزي مثل `Al-Kahf` أو `Ya-Seen`.\n\n4.  أي رقم آخر بين 1 و114، ويُعلَّم هذا بـ«تحقّق من السورة».\n\nويمكن تصحيح أي سورة يدويًا من قائمة في الجدول.\n\nجدول المراجعة بعد اختيار الملفات: الاسم الحالي، والسورة التي تعرّفت عليها الأداة، والاسم الجديد، والحالة، وفوقه عدد الملفات والسور الناقصة.\n\n![جدول المراجعة في أداة رقيم](https://community.itqan.dev/assets/files/2026-11-22/1795334102-784573-2-tool-review-table-1.png)\n\n**التنبيهات قبل التنفيذ:**\n\n- سورة لم تُعرف أو مكررة: لا تُعاد تسمية الملف حتى تُصحّح.\n\n- السور الناقصة من المصحف بأرقامها.\n\n- جودة الملف الفعلية: تقرؤها الأداة من داخل ملف MP3، وتنبّه إذا كان الملف 64 والاسم سيقول `BR128`، أو إذا كانت جودته متغيرة (VBR).\n\n**التنفيذ.** عند اختيار مجلد تُعاد تسمية الملفات في مكانها بضغطة واحدة، ولا تُستبدل ملفات موجودة بالاسم نفسه. ومن اختار ملفات منفردة ينزّل ملف أوامر `.bat` يشغّله داخل المجلد على Windows. ويمكن أيضًا تنزيل جدول CSV بالأسماء القديمة والجديدة.\n\nبعدها تنتقل الأداة إلى كتابة البيانات الداخلية في الملفات نفسها، كما يأتي في قسم البيانات الداخلية.\n\n## المسار الثاني: مصحف يحتاج نسخة MP3 أو M4A\n\nتحوّل الأداة المصحف إلى MP3 بالجودة المختارة (128 افتراضيًا)، وتحفظ النسخ في مجلد فرعي داخل مجلد المصحف:\n\n- `mp3_128` للنسخة بدون مؤثرات.\n\n- `mp3_128_fx` للنسخة بالمؤثرات.\n\nويتغير اسم المجلد مع الجودة، فيصبح مثلًا `mp3_64` أو `mp3_320_fx`. وكل ملف يخرج باسم مرقوم وبياناته الداخلية مكتوبة، فلا يحتاج إلى خطوة تسمية بعد التحويل.\n\n**جودة الترميز.** يستعمل رقيم مرمِّز LAME الأصلي (الإصدار 3.100)، وهو المرمِّز المرجعي لصيغة MP3، مبنيًا داخل الأداة فيعمل دون إنترنت. يرمّز بجودة ثابتة (CBR)، ومخزن البتات فيه مفعّل، ويأخذ الصوت بدقته الكاملة دون تقليصه إلى 16 بت، ويبقي تردد الملف كما في الأصل. ويختار المستخدم بين إعدادين:\n\n|                                            | أعلى دقة ممكنة (الافتراضي)                            | قياسي                                                 |\n|--------------------------------------------|------------------------------------------------------------------------------|------------------------------------------------------------------------------|\n| مستوى الدقة في LAME | 0، وهو الأعلى                                         | 2، وهو الموصى به في وثائق LAME                        |\n| الاستريو            | استريو مشترك (Joint Stereo) دائمًا، حتى للمصدر الأحادي | استريو مشترك (Joint Stereo) دائمًا، حتى للمصدر الأحادي |\n| السرعة              | أبطأ من القياسي بنحو مرتين إلى 3 مرات                 | أسرع                                                  |\n\nوالجودة المختارة (128 مثلًا) وحجم الملف واسم المجلد الناتج واحدة في الإعدادين. وما يخرج بـ«أعلى دقة» هو أفضل ملف يستطيع LAME إنتاجه بالجودة المختارة، سواء كانت 64 أو 128 أو 256 أو 320.\n\n**نسخة M4A (AAC).** ويستطيع رقيم إنتاج نسخة بصيغة M4A بالجودات نفسها (64 أو 128 أو 256 أو 320)، في مجلد مثل `m4a_128` أو `m4a_128_fx`. يستعمل لذلك مرمِّز Fraunhofer FDK AAC، من أجود مرمِّزات AAC المفتوحة، مبنيًا داخل الأداة كذلك. يرمّز بصيغة AAC-LC بجودة ثابتة وبأعلى إعداداته (Afterburner)، استريو دائمًا، ويضبط مدة الملف بدقة فلا تزيد النسخة صمتًا في أولها. ولا يُنتج الـM4A إلا من مصدر عالي الجودة: ملف WAV، أو MP3 بجودة 256 أو 320، وتُتخطّى المصادر الأقل جودة حتى لا تتراكم خسارة الضغط مرتين. وتُكتب بياناته الداخلية وصورة الغلاف داخل الملف أثناء التحويل.\n\n**تزمين واحد لكل الجودات.** يعوّض رقيم في نسخة M4A تأخير المرمِّز بدقة داخل الملف، فيبدأ صوتها في اللحظة نفسها التي يبدأ فيها ملف WAV الأصلي، دون زيادة أو نقص ولو عيّنة صوتية واحدة، وفي كل الجودات. وقد تحققنا من ذلك قياسًا في الجودات 64 و128 و256 و320. لذلك يصلح تزمين الآيات المعمول على ملف WAV لكل نسخ M4A الناتجة منه، ولا حاجة إلى تزمين كل نسخة على حدة. أما ملفات MP3 فيضيف مرمِّزها صمتًا قصيرًا في أولها، وتختلف المشغلات في التعامل معه وفي دقة الانتقال داخل الملف، فيحتاج كل إصدار منها إلى تزمين خاص به.\n\n**ما تقبله الأداة:**\n\n- WAV بدقة 8 أو 16 أو 24 أو 32 بت، مع قراءة متدفقة لا تملأ الذاكرة حتى مع البقرة.\n\n- MP3 بأي جودة. وإن كانت جودته هي المطلوبة أصلًا يُنسخ كما هو دون إعادة ضغط، حفاظًا على جودته.\n\n- ترددات مثل 96 أو 88.2 كيلوهرتز تُحوَّل تلقائيًا بمحوِّل LAME عالي الجودة إلى 48 أو 44.1.\n\n- صيغ M4A وFLAC وOGG تعمل أيضًا، لكنها تستهلك ذاكرة أكبر مع السور الطويلة.\n\n**أثناء التحويل:**\n\n- تحوّل الأداة حتى ثلاثة ملفات في وقت واحد بحسب قوة الجهاز، وتعرض نسبة التقدم لكل ملف.\n\n- الملفات الأصلية لا تُمسّ.\n\n- يمكن إيقاف التحويل في أي لحظة، وعند إعادة تشغيله يتخطى الملفات التي اكتملت ويكمل الباقي.\n\n**بعد التحويل.** تعرض الأداة مكان الملفات بالضبط، مثل «تلاواتي 1448 ← mp3_128»، وزر «عرض الملفات الناتجة وتشغيلها» الذي يسرد الملفات بأحجامها ويشغّل أيًا منها داخل الأداة، فيتأكد المستخدم من الجودة دون أن يغادرها.\n\nالتحويل يجري داخل المتصفح، وسرعته بحسب قوة الجهاز والإعداد المختار. ويستغرق «أعلى دقة» وقتًا أطول من «قياسي»، فلمصحف كامل يُفضّل استعمال أقوى جهاز متاح. وتعالج الأداة عدة ملفات معًا، كل ملف على نواة مستقلة من المعالج، ويحدد المستخدم عددها أو يتركه تلقائيًا بحسب أنوية جهازه. في تجربة فعلية بإعداد «أعلى دقة» تحوّل مصحف كامل في 26 دقيقة بمعالجة 6 ملفات معًا، مقابل أكثر من 35 دقيقة بثلاثة ملفات.\n\n## البيانات الداخلية للملفات\n\nتكتب الأداة في كل ملف البيانات التي يعرضها المشغّل ومتصفح الملفات، وفق البند 12.5 من مرقوم. يُدخل المستخدم اسم القارئ بالعربية، والأداة تقترح الباقي ويمكن تعديله.\n\n| الحقل     | ما يُكتب فيه                                               | مثال                                                                 |\n|----------------------------------|----------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------|\n| Title                            | عنوان السورة الثابت في كل التلاوات                        | 103 - Al-Asr (The Time) سورة العصر                                                          |\n| Track                            | رقم السورة من 114                                         | 103/114                                                                                     |\n| Author / Artist                  | اسم القارئ بالعربية والإنجليزية                           | يوسف بن سعيد الدوسري - Yusof Addosari                                |\n| Album                            | اسم المصحف، يُبنى من الرواية والأداء                       | المصحف المرتل للقارئ يوسف بن سعيد الدوسري برواية حفص عن عاصم بالتوسط |\n| Composer / Copyright / Publisher | الناشر، يُملأ من رمز المشروع                               | المركز السعودي للتلاوات                                              |\n| Link                             | رابط إتقان                                                | https://itqan.dev                                                                           |\n| Cover                            | شعار الناشر، مع تنبيه إن لم يكن مربعًا أو كانت دقته منخفضة | —                                                                    |\n| Comment وYear وGenre             | اختيارية                                                  | Quran                                                                                       |\n\n**عناوين ثابتة للسور.** عناوين السور الـ114 مأخوذة من ملف أسماء السور المعتمد في مرقوم (الأسماء الإنجليزية من ترجمة الدكتور محسن خان والشيخ تقي الدين الهلالي)، وهي محفوظة داخل الأداة، فتكون واحدة في كل المصاحف.\n\n**كل البيانات النصية بترميز UTF-16 مع BOM.** تُكتب البيانات بمعيار ID3v2.3، وكل حقل نصي فيها (العنوان والقارئ والألبوم والناشر والتعليق وغيرها) بترميز UTF-16 مسبوقًا بعلامة ترتيب البايتات (BOM). هذا الترميز تقرؤه كل المشغلات والأنظمة الشائعة: متصفح ملفات Windows وWindows Media Player وiTunes وVLC ومشغلات السيارات والجوال. أما UTF-8 فهو جزء من ID3v2.4 فقط، وكثير من المشغلات لا يدعمه، فيظهر النص العربي رموزًا غريبة. وحقل الرابط وحده بحروف لاتينية بحسب المعيار نفسه، لأن الروابط لاتينية أصلًا. أما ملفات M4A فتُكتب بياناتها بمعيار MP4 (iTunes) وترميز UTF-8 الذي يفرضه هذا المعيار، وتقرؤها المشغلات نفسها بالعربية سليمة.\n\nوهذا ملف من المصحف نفسه في مشغّل VLC: اسم القارئ بالعربية والإنجليزية وعنوان السورة في شريط العنوان، وشعار الناشر ظاهر بوصفه صورة الألبوم.\n\n![ملف من المصحف في مشغل VLC مع بياناته وشعار الناشر](https://community.itqan.dev/assets/files/2026-11-22/1795334202-850398-5-vlc-metadata.png)\n\n**علامات Sound Forge باقية.** إذا كان في الملف علامات توقيت أضافها Sound Forge فهي تبقى كما هي، وتُستبدل باقي البيانات القديمة بالجديدة. والصوت نفسه لا يتغير.\n\nتحفظ الأداة هذه البيانات مع الصورة في المتصفح، فلا تُعاد كتابتها في المرة التالية على الجهاز نفسه.\n\n## المسار الثالث: فحص أسماء مصحف موجود\n\nيلصق المستخدم أسماء الملفات أو يختار الملفات، فتفحص الأداة كل اسم حقلًا حقلًا وتبيّن موضع الخطأ بالضبط. مثال ذلك الاسم:\n\n```\nQR_SC1447_ibrahim addosari_As-Hf_mdd_BR128_FX_1.mp3\n```\n\nتظهر فيه ثلاثة أخطاء:\n\n- اسم القارئ بحروف صغيرة وفيه مسافة بدل الشرطة.\n\n- رقم السورة خانة واحدة بدل ثلاث.\n\n- الاسم يحتوي مسافات.\n\nوتفحص الأداة كذلك أن رمز الرواية من الرموز العشرين المعتمدة، وأن رموز الأداء والجودة من القائمة، وأن الاسم لا يحمل حقولًا زائدة بعد رقم السورة. وهذا يحقق ما يطلبه مرقوم من «فحوص آلية لامتثال التسمية».\n\n## المتطلبات والخصوصية والحدود\n\nالأداة ملف HTML واحد يُفتح بالنقر المزدوج، بلا تثبيت وبلا إنترنت. مرمِّز LAME الأصلي (المرمِّز المرجعي لصيغة MP3) وشعار إتقان وأسماء السور كلها داخل الملف.\n\n| البيئة                | التسمية والفحص                     | إعادة التسمية المباشرة والتحويل والبيانات الداخلية |\n|----------------------------------------------|-----------------------------------------------------------|---------------------------------------------------------------------------|\n| Chrome أو Edge على Windows أو macOS أو Linux | نعم                                | نعم                                                |\n| Firefox أو Safari                            | نعم، مع تنزيل ملف `.bat` وجدول CSV | لا                                                 |\n| الجوال والآيباد       | لا                                 | لا                                                 |\n\n- **الخصوصية:** الملفات لا تغادر الجهاز، فكل المعالجة تجري داخل المتصفح.\n\n- **الأصول آمنة:** التحويل ينشئ نسخًا جديدة، وكتابة البيانات لا تغيّر الصوت.\n\n- **فتح الملف:** يُفتح من مجلد على الجهاز، لا من معاينة البريد أو Google Drive.\n\n- **الإعدادات:** تُحفظ في متصفح الجهاز الذي استُعمل، ولا تنتقل إلى جهاز آخر.\n\n- **السرعة:** التحويل أبطأ من البرامج المتخصصة، وقد يستغرق مصحف كامل من نصف ساعة إلى ساعة بحسب الجهاز.\n\n## ابدأ في خمس خطوات\n\n1.  احفظ ملف الأداة على جهازك وافتحه في Chrome أو Edge.\n\n2.  اختر حالة مصحفك من صفحة البداية.\n\n3.  عبّئ بيانات المصحف والبيانات الداخلية، واختر صورة شعار الناشر.\n\n4.  اختر مجلد الملفات، وراجع الجدول وصحّح ما تنبّه عليه الأداة.\n\n5.  نفّذ إعادة التسمية وكتابة البيانات، أو التحويل، ثم ارفع الملفات على فنار أو أي نظام آخر.\n\nننصح بتجربة كل مسار أولًا على نسخة من مجلد صغير فيه سور قليلة، والاستماع للناتج قبل تشغيله على مصحف كامل.\n\n## دعوة لتوحيد تسمية ملفات التلاوات\n\nرقيم ليس أداة داخلية لفريق واحد. هو دعوة لكل العاملين في الحقل القرآني — جهات التسجيل، والمراكز القرآنية، ومطوّري التطبيقات والمنصات — إلى الاجتماع على نظام واحد لتسمية ملفات التلاوات.\n\nحين تتبنّى الجهات المختلفة المعيار نفسه، ينتقل المصحف من جهة إلى أخرى دون إعادة تسمية، وتقرأ التطبيقات الملفات آليًا أيًا كان مصدرها، ويُبنى على هذه الملفات ما يخدم التقنيات القرآنية من مشغلات وتطبيقات تعليمية وأبحاث دون جهد مكرر. والأداة مجانية ومفتوحة للجميع، ليكون تطبيق المعيار في متناول كل من يريده.\n\n## نقاط مفتوحة للنقاش\n\nبعض ما في معيار مرقوم يحتاج إلى قرار، ونرحب بآرائكم فيه:\n\n- **صيغة اسم الألبوم:** الأداة تقترح «المصحف المرتل للقارئ … برواية …»، وهي قابلة للتعديل.\n\nجرّبوا الأداة على مصاحفكم، وشاركونا ما تجدونه من أخطاء أو مقترحات في مجتمع إتقان.\n\nيمكن تحميل الأداة من [هـــنــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــا](https://drive.google.com/file/d/1rrzRvLqzpilHFtEYKiPnXtbd13QXbopQ/view?usp=sharing)\n";
const $=id=>document.getElementById(id);
const KEY="md-viewer-text-v3";
let text=DEFAULT_MD;
try{const v=localStorage.getItem(KEY); if(v) text=v;}catch(e){}
$("src").value=text;
function render(){
  const html=DOMPurify.sanitize(marked.parse($("src").value,{gfm:true,breaks:false}));
  $("view").innerHTML=html;
  $("view").querySelectorAll("p,li,td,th,h1,h2,h3,blockquote").forEach(el=>el.setAttribute("dir","auto"));
  const LOCAL={"https://community.itqan.dev/assets/files/2026-11-22/1795333799-174885-3-before-naming-1.png": "images/3_before-naming.png", "https://community.itqan.dev/assets/files/2026-11-22/1795333884-416910-4-after-naming-1.png": "images/4_after-naming.png", "https://community.itqan.dev/assets/files/2026-11-22/1795333975-598630-1-tool-landing-1.png": "images/1_tool-landing.png", "https://community.itqan.dev/assets/files/2026-11-22/1795334102-784573-2-tool-review-table-1.png": "images/2_tool-review-table.png", "https://community.itqan.dev/assets/files/2026-11-22/1795334202-850398-5-vlc-metadata.png": "images/5_vlc-metadata.png"};
  $("view").querySelectorAll("img").forEach(im=>{ const u=im.getAttribute("src"); if(LOCAL[u]) im.src=LOCAL[u]; });
  $("view").querySelectorAll("a[href]").forEach(a=>{ a.target="_blank"; a.rel="noopener"; });
}
render();
$("src").addEventListener("input",()=>{ render(); try{localStorage.setItem(KEY,$("src").value)}catch(e){} });
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t));
  $("view").classList.toggle("hidden",t.dataset.t!=="view");
  $("srcWrap").classList.toggle("hidden",t.dataset.t!=="src");
});
function flash(t){ $("msg").textContent=t; clearTimeout(flash.t); flash.t=setTimeout(()=>$("msg").textContent="",2500); }
function fallbackCopy(el){ // select and copy with the browser's copy command
  const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r);
  let ok=false; try{ ok=document.execCommand("copy") }catch(e){} s.removeAllRanges(); return ok;
}
$("copyMd").onclick=async()=>{
  const t=$("src").value;
  try{ await navigator.clipboard.writeText(t); flash("نُسخ المارك داون ✓"); }
  catch(e){ const ta=$("src"); const wasHidden=$("srcWrap").classList.contains("hidden"); $("srcWrap").classList.remove("hidden"); ta.select(); let ok=false; try{ok=document.execCommand("copy")}catch(_){} if(wasHidden)$("srcWrap").classList.add("hidden"); flash(ok?"نُسخ المارك داون ✓":"تعذّر النسخ؛ حدّد النص يدويًا وانسخه"); }
};
$("copyRich").onclick=async()=>{
  const el=$("view"); const wasHidden=el.classList.contains("hidden"); el.classList.remove("hidden");
  try{
    await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([el.innerHTML],{type:"text/html"}),"text/plain":new Blob([el.innerText],{type:"text/plain"})})]);
    flash("نُسخ النص المنسّق ✓");
  }catch(e){ flash(fallbackCopy(el)?"نُسخ النص المنسّق ✓":"تعذّر النسخ؛ حدّد النص يدويًا وانسخه"); }
  if(wasHidden) el.classList.add("hidden");
};
$("reset").onclick=()=>{ $("src").value=DEFAULT_MD; try{localStorage.removeItem(KEY)}catch(e){} render(); flash("استُعيد مقال رقيم"); };
</script>
